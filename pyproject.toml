[project]
name = "ai-infra-lab"
version = "0.1.0"
description = "An evidence-based, agent-independent AI infrastructure learning lab"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=2,<3", "torch>=2.6,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["labs/phase-01/week-01/tests"]
pythonpath = ["labs/phase-01/week-01"]
addopts = "--strict-markers --strict-config"
markers = [
    "environment: bootstrap checks; not evidence of learner understanding",
    "exercise: learner acceptance checks; fail until the exercises are implemented",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
